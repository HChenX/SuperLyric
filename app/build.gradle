plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

android {
    Properties properties = new Properties()
    File localPropertiesFile = project.rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withInputStream { properties.load(it) }
    }

    def signingPropertyNames = ['keyStoreFile', 'keyStorePassword', 'keyAlias', 'keyAliasPassword']
    def hasReleaseSigning = signingPropertyNames.every { properties.getProperty(it)?.trim() }
    if (!hasReleaseSigning) {
        logger.warn('Release signing credentials are incomplete or local.properties is missing; release APKs will be built unsigned. ' +
                'Define keyStoreFile, keyStorePassword, keyAlias, and keyAliasPassword to sign release builds.')
    }
    if (project.hasProperty('requireReleaseSigning') && !hasReleaseSigning) {
        // 发布流水线显式要求签名：缺凭据时构建失败，避免把未签名 APK 当发布产物上传
        throw new org.gradle.api.GradleException(
                'Release signing credentials are required but missing: ' +
                        'keyStoreFile, keyStorePassword, keyAlias and keyAliasPassword must be set.')
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(properties.getProperty('keyStoreFile'))
                storePassword properties.getProperty('keyStorePassword')
                keyAlias properties.getProperty('keyAlias')
                keyPassword properties.getProperty('keyAliasPassword')
                // minSdk 30：安装与校验只使用 V2/V3，V1 的 META-INF 签名文件是纯冗余
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    namespace "com.hchen.superlyric"
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.hchen.superlyric"
        minSdk 30
        targetSdk 37
        // noinspection HighAppVersionCode
        versionCode 2026111400
        versionName "4.2"

        ndk {
            // noinspection ChromeOsAbiSupport
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : null
        }

        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        aidl true
        compose true
        buildConfig true
    }

    androidResources {
        generateLocaleConfig = true
        // 应用只有默认（英文）与 values-zh-rCN 文案；依赖库附带的其余语言资源不在支持范围
        localeFilters.addAll(['zh-rCN', 'zh-rHK', 'zh-rTW'])
        // 依赖 AAR 附带的资产：OkHttp PublicSuffixDatabase 只服务 topPrivateDomain，
        // baseline profile 只服务 Play 云端下发；本项目均不使用
        ignoreAssetsPatterns.addAll(['PublicSuffixDatabase.list', 'baseline.prof', 'baseline.profm'])
    }

    // 运行时不会读取的依赖资源：
    // - PublicSuffixDatabase.list 只被 OkHttp HttpUrl.topPrivateDomain 惰性读取，本项目不使用
    // - baseline.prof/profm 只服务 Play 云端 profile，侧载模块不需要
    // - DebugProbesKt.bin 只服务 kotlinx-coroutines-debug，未引入
    // - kotlin/*.kotlin_builtins 只服务 kotlin-reflect，运行时不包含 reflect 实现
    packaging {
        resources {
            excludes += [
                '/DebugProbesKt.bin',
                '/kotlin/**',
                'assets/dexopt/baseline.prof',
                'assets/dexopt/baseline.profm',
                'META-INF/version-control-info.textproto',
            ]
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors true
        // 资源位置与 AGP 更新提示不作为项目代码门禁：头像保持 densityless 以免改变渲染，
        // AGP 升级属于独立版本变更。
        disable += ['IconLocation', 'AndroidGradlePluginVersion']
    }

    testOptions {
        unitTests.all {
            it.useJUnitPlatform()
        }
        unitTests.returnDefaultValues = true
    }
}

androidComponents {
    onVariants(selector()) { variant ->
        def buildType = variant.buildType

        variant.outputs.forEach { output ->
            def vName = output.versionName.get()
            def vCode = output.versionCode.get()
            output.outputFileName.set("SuperLyric-v${vName}-${vCode}-${buildType}.apk")
        }
    }
}

dependencies {
    configurations.configureEach {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
        resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
    }

    implementation libs.appcompat
    implementation libs.annotation

    implementation platform(libs.compose.bom)
    implementation libs.foundation.android
    implementation libs.activity.compose
    implementation libs.ui.graphics
    implementation libs.lifecycle.viewmodel.ktx

    implementation libs.miuix.core.android
    implementation libs.miuix.ui.android
    implementation libs.miuix.preference.android
    implementation libs.miuix.blur.android
    implementation libs.miuix.icons.android
    implementation libs.miuix.shader.android
    implementation libs.miuix.squircle.android

    compileOnly libs.api
    implementation libs.service
    implementation libs.hooktool
    implementation libs.superlyricapi
    implementation libs.xxpermissions
    implementation project(':lyric-kernel')
    implementation project(':shared')
    implementation project(':hook-anchors')
    implementation project(':hooks-id')
    implementation project(':lyric-hook')
    implementation project(':lyric-network')
    implementation project(':lyric-service')

    compileOnly project(':processor')
    annotationProcessor project(':processor')

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}
