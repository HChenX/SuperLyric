// Root project build configuration.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21"
    }
}

plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
}

subprojects {
    // 项目代码的编译门禁：第三方 classfile 警告与必须保留的 3.x deprecation 不计入。
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:all,-deprecation,-classfile,-auxiliaryclass,-processing', '-Werror']
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            allWarningsAsErrors.set(true)
            // 3.x 边界必须继续使用已 deprecated 的 SuperLyricData；与 Java 门禁保持一致。
            freeCompilerArgs.add('-Xwarning-level=DEPRECATION:disabled')
        }
    }
}