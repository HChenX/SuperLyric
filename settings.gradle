pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://api.xposed.info/" }
        maven {
            url 'https://jitpack.io'
            content {
                includeGroup "com.github.HChenX"
                includeGroup "com.github.getActivity"
            }
        }
    }
}

rootProject.name = "SuperLyric"
include ':app'
include ':processor'
include ':lyric-kernel'
include ':shared'
include ':hook-anchors'
include ':hooks-id'
include ':lyric-hook'
include ':lyric-network'
include ':lyric-service'
